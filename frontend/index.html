<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UNICEFINDER - Entrar</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/logo.jpeg" type="image/jpeg">
</head>
<body>
  <div class="app-wrapper">
    <div class="app-container">
      
      <!-- Gradient Header Area -->
      <header class="auth-hero">
        <h1 class="logo-brand">UNICE<span>FINDER</span></h1>
        <h2 class="hero-subtitle">Bem-vindo de volta!</h2>
        <p class="hero-desc">O sistema oficial de achados e perdidos da nossa instituição.</p>
      </header>

      <!-- Login Form Card -->
      <main class="auth-card">
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email" class="form-label">E-mail Institucional <span class="required">*</span></label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-control" 
              placeholder="seu.nome@unice.br" 
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Senha <span class="required">*</span></label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="Digite sua senha (mínimo 8 caracteres)" 
              minlength="8" 
              required
              autocomplete="current-password"
            >
          </div>

          <div class="form-auth-links">
            <a href="#" id="forgotPasswordLink">Esqueci minha senha</a>
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
            <span>Entrar</span>
          </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
          <p style="color: var(--text-light);">
            Não tem uma conta? 
            <a href="register.html" style="font-weight: 700;">Cadastre-se</a>
          </p>
        </div>
      </main>

    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="globalModal" class="modal-backdrop"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
